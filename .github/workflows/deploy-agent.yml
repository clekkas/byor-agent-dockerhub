name: Build, push, and deploy hosted agent (Foundry, anonymous Docker Hub pull)

# Proves a Microsoft Foundry hosted agent can pull its container image from a PUBLIC Docker Hub
# repository with NO Foundry registry connection and NO OIDC token exchange configured -- see
# infra/hosted-agent/main.tf, whose container_configuration block omits registry_connection_id
# entirely. Both the image build/push and the Foundry deploy run on GitHub-hosted runners, so
# there is no dependency on any local machine's network/Docker setup.

on:
  push:
    branches: [main]
    paths:
      - app.py
      - knowledge/**
      - requirements.txt
      - Dockerfile
      - infra/hosted-agent/**
      - scripts/test-hosted-agent.py
      - .github/workflows/deploy-agent.yml
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Optional: deploy an existing Docker Hub image digest instead of building (leave empty to build)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: dockerhub-hosted-agent-deployment
  cancel-in-progress: false

env:
  FOUNDRY_PROJECT_ENDPOINT: https://kaiser-foundry-resource.services.ai.azure.com/api/projects/workshop-demo-project
  AZURE_TENANT_ID: 16b3c013-d300-468d-ac64-7eda0820b6d3
  AZURE_SUBSCRIPTION_ID: 0e494a0c-e2e6-41f8-8a50-6064d842225e
  AZURE_CLIENT_ID: a24802c6-4286-4572-8733-377837098a2d
  STATE_RESOURCE_GROUP: kaiser-foundry-rg
  STATE_STORAGE_ACCOUNT: tfstateb173d2d85c34
  STATE_CONTAINER: dockerhub-agent-tfstate
  STATE_KEY: hosted-agent/proof.tfstate
  DOCKERHUB_NAMESPACE: clekkas
  IMAGE_NAME: byor-agent-dockerhub

jobs:
  build:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Use provided digest instead of building
        if: inputs.image_digest != ''
        id: provided
        run: echo "image=${{ inputs.image_digest }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.image_digest == ''
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: inputs.image_digest == ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        if: inputs.image_digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Smoke test pushed image
        if: inputs.image_digest == ''
        run: |
          image="docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cid=$(docker run -d --rm -p 8088:8088 "$image")
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8088/readiness >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8088/readiness
          curl -fsS -X POST http://localhost:8088/responses \
            -H 'Content-Type: application/json' \
            -d '{"input":"Foundry image smoke test"}' | tee /tmp/resp.json
          python3 -c 'import json; r=json.load(open("/tmp/resp.json")); assert r["status"] == "completed" and r["output_text"], r'
          docker stop "$cid" >/dev/null

      - name: Resolve immutable image digest
        id: digest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            echo "image=${{ inputs.image_digest }}" >> "$GITHUB_OUTPUT"
            echo "Using provided digest: ${{ inputs.image_digest }}"
          else
            image="docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "Built and pushed: $image"
          fi

  deploy:
    name: Terraform agent deploy (no registry connection)
    needs: build
    runs-on: [self-hosted, linux, byor-private]
    env:
      ARM_CLIENT_ID: a24802c6-4286-4572-8733-377837098a2d
      ARM_TENANT_ID: 16b3c013-d300-468d-ac64-7eda0820b6d3
      ARM_SUBSCRIPTION_ID: 0e494a0c-e2e6-41f8-8a50-6064d842225e
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_endpoint: https://kaiser-foundry-resource.services.ai.azure.com/api/projects/workshop-demo-project
      TF_VAR_agent_name: dockerhub-anon-agent
      TF_VAR_image_uri: ${{ needs.build.outputs.image }}
      TF_VAR_model_deployment_name: ""
      TF_VAR_cpu: "0.5"
      TF_VAR_memory: "1Gi"
      TF_VAR_import_existing_agent: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: a24802c6-4286-4572-8733-377837098a2d
          tenant-id: 16b3c013-d300-468d-ac64-7eda0820b6d3
          subscription-id: 0e494a0c-e2e6-41f8-8a50-6064d842225e

      - name: Validate inputs
        run: |
          case "$TF_VAR_image_uri" in
            docker.io/clekkas/byor-agent-dockerhub@sha256:*) ;;
            *)
              echo "::error::image_digest must be an immutable digest under docker.io/clekkas/byor-agent-dockerhub"
              exit 1
              ;;
          esac
          echo "Deploying image: $TF_VAR_image_uri"
          echo "No registry_connection_id will be set -- see infra/hosted-agent/main.tf"

      - name: Terraform init (hosted-agent state)
        working-directory: infra/hosted-agent
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ env.STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.STATE_CONTAINER }}" \
            -backend-config="key=${{ env.STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan (adopt agent and create candidate version)
        working-directory: infra/hosted-agent
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply hosted agent
        working-directory: infra/hosted-agent
        run: |
          terraform apply -input=false tfplan
          rm -f tfplan

      - name: Capture candidate version
        id: agent
        working-directory: infra/hosted-agent
        run: |
          version="$(terraform output -raw agent_version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidate version: $version"

      - name: Wait for and smoke test candidate
        run: |
          python3 scripts/test-hosted-agent.py \
            --endpoint "$TF_VAR_project_endpoint" \
            --agent "$TF_VAR_agent_name" \
            --version "${{ steps.agent.outputs.version }}" \
            --expected-image "$TF_VAR_image_uri" \
            --expected-model "$TF_VAR_model_deployment_name"
